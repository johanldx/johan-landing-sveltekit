<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Balises SEO de base -->
		<title>Johan Ledoux | Theed</title>
		<meta name="description" content="%sveltekit.description%" />
		<meta name="keywords" content="développement web, portfolio, projets, technologies, SvelteKit, JavaScript, TypeScript, SPA" />
		<meta name="author" content="Johan Ledoux" />
		<meta name="robots" content="index, follow" />
		<meta name="language" content="fr" />
		<meta name="revisit-after" content="7 days" />
		<meta name="distribution" content="global" />
		<meta name="rating" content="general" />
		<meta name="application-name" content="Johan Ledoux Portfolio" />
		<meta name="mobile-web-app-capable" content="yes" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://v5.johan.theed.fr/" />
		<meta property="og:title" content="%sveltekit.title%" />
		<meta property="og:description" content="%sveltekit.description%" />
		<meta property="og:image" content="/presentation.webp" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="Johan Ledoux - Portfolio" />
		<meta property="og:locale" content="fr_FR" />
		
		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://v5.johan.theed.fr/" />
		<meta name="twitter:title" content="%sveltekit.title%" />
		<meta name="twitter:description" content="%sveltekit.description%" />
		<meta name="twitter:image" content="/presentation.webp" />
		
		<!-- Balises supplémentaires pour le SEO -->
		<meta name="theme-color" content="#101010" />
		<meta name="msapplication-TileColor" content="#101010" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Johan Ledoux" />
		
		<!-- Canonical URL -->
		<link rel="canonical" href="https://v5.johan.theed.fr/" />
		
		<!-- Preconnect pour les performances -->
		<link rel="preconnect" href="https://api.fontshare.com" />
		<link rel="dns-prefetch" href="https://api.fontshare.com" />
		
		<!-- Manifest pour PWA -->
		<link rel="manifest" href="/manifest.json" />
		
		<!-- Balises pour les réseaux sociaux -->
		<meta name="linkedin:owner" content="johanldx" />
		<meta name="github:owner" content="johanldx" />
		
		<!-- Balises pour la localisation -->
		<meta name="geo.region" content="FR" />
		<meta name="geo.placename" content="France" />
		
		<!-- Balises pour la sécurité -->
		<meta http-equiv="X-Content-Type-Options" content="nosniff" />
		<meta http-equiv="X-Frame-Options" content="DENY" />
		<meta http-equiv="X-XSS-Protection" content="1; mode=block" />
		<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
		
		<!-- Balises pour les performances -->
		<link rel="preload" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@1&display=swap" as="style" />
		
		%sveltekit.head%
		<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@1&display=swap" rel="stylesheet">
		<link rel="image_src" href="/presentation.webp" />
		<meta itemprop="image" content="/presentation.webp" />
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#101010] text-white">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
